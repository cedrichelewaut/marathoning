# Training board config. Edit this, then:
#   python3 cli.py generate-schedule
#   python3 cli.py sync-site
# A fork keeps its own copy of this file. See config.example.yaml for a blank start.

site:
  # Heading on the board. The browser title is "<race name> training".
  title: Marathon training
  # Public URLs for this repo. Not printed on the page. A fork should
  # replace both; Pages will be https://<user>.github.io/<repo>/
  pages_url: https://cedrichelewaut.github.io/running-tracker/
  repo_url: https://github.com/cedrichelewaut/running-tracker

race:
  name: Hamburg Marathon
  date: 2027-04-25

goal:
  # Goal marathon pace, min:sec per km.
  pace_per_km: "4:30"

training:
  # Monday of week 1 of the 18-week block. Count 18 weeks back from the
  # race week (the Monday of the week that contains race.date). Weeks
  # before this date are base building.
  plan_18wk_start: 2026-12-21
  # Peak weekly distance of the 18-week block, in km.
  peak_weekly_km: 89
  # Weekly distance at the start of the 18-week block, in km. The block
  # ramps from this value to peak_weekly_km.
  race_block_start_km: 53
  # First base-building week, in km. Later weeks ramp toward the two
  # targets below.
  base_building_start_km: 18
  # Weekly distance and long run to reach by the last base week, in km.
  base_building_final_total_km: 38
  base_building_final_long_km: 17
  # Replace LT, VO2max, and hill sessions with general aerobic or
  # marathon-pace running. Optional strides stay in the plan.
  avoid_fast_running: true
